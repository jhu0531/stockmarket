<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관심종목 | 주린이 기우제</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/icons/favicon-32.png" sizes="32x32" />
  <link rel="icon" type="image/png" href="/icons/favicon-16.png" sizes="16x16" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#14161a" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="loading-overlay">
    <iframe id="loading-frame" title="로딩 중"></iframe>
  </div>
  <script>
    if (sessionStorage.getItem('raindanceShown')) {
      document.getElementById('loading-overlay').remove();
    } else {
      sessionStorage.setItem('raindanceShown', '1');
      document.getElementById('loading-frame').src = 'loading.html';
    }
  </script>

  <div class="app-shell">
    <nav class="sidebar">
      <div class="sidebar-brand">🪶 주린이 기우제</div>
      <a href="/" class="sidebar-link"><span class="sidebar-icon">🏠</span><span>홈</span></a>
      <a href="/news.html" class="sidebar-link"><span class="sidebar-icon">📰</span><span>경제뉴스</span></a>
      <a href="/calendar.html" class="sidebar-link"><span class="sidebar-icon">📅</span><span>증시캘린더</span></a>
      <a href="/reports.html" class="sidebar-link"><span class="sidebar-icon">📄</span><span>증시리포트</span></a>
      <a href="/compass.html" class="sidebar-link"><span class="sidebar-icon">🧭</span><span>증시나침반</span></a>
      <a href="/watchlist.html" class="sidebar-link active"><span class="sidebar-icon">⭐</span><span>관심종목</span></a>
      <a href="/valuation.html" class="sidebar-link"><span class="sidebar-icon">🧮</span><span>적정주가</span></a>
    </nav>

    <div class="app-content">
      <header class="site-header">
        <div class="container">
          <h1>관심종목</h1>
          <p class="subtitle">종목 검색 · 추가 · 관리</p>
        </div>
      </header>

      <main class="container">
        <div class="auth-bar">
          <span id="auth-status">로그인 확인 중...</span>
          <button id="login-btn" type="button" class="auth-btn" hidden>구글로 로그인</button>
          <button id="logout-btn" type="button" class="auth-btn" hidden>로그아웃</button>
        </div>

        <section id="watchlist-login-required">
          <p class="calendar-empty">관심종목을 이용하려면 로그인해주세요.</p>
        </section>

        <section id="watchlist-content" hidden>
          <div class="stock-search">
            <input type="text" id="stock-search-input" placeholder="종목명 검색 (예: 삼성전자)" autocomplete="off" />
            <ul class="search-results" id="search-results" hidden></ul>
          </div>

          <ul class="watchlist-list" id="watchlist-list">
            <li class="calendar-empty">불러오는 중...</li>
          </ul>
        </section>
      </main>

      <footer class="site-footer">
        <div class="container">
          <p>데이터 제공: 네이버 금융</p>
        </div>
      </footer>
    </div>
  </div>

  <script type="module" src="watchlist.js"></script>
</body>
</html>
