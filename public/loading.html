<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>주린이 기우제 — 로딩 중</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background:
        linear-gradient(to bottom,
          #5bbfff 0%,
          #87ceeb 35%,
          #b0dff5 55%,
          #d4a96a 72%,
          #c8864a 82%,
          #a0622a 100%
        );
      display: flex; align-items: center; justify-content: center;
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      overflow: hidden; position: relative;
    }

    /* 태양 */
    .sun {
      position: fixed; top: 7vh; left: 12vw;
      width: 80px; height: 80px; border-radius: 50%;
      background: radial-gradient(circle at 40% 38%, #fffbe0, #ffe033 55%, #ffb300);
      box-shadow: 0 0 50px 20px rgba(255,210,30,0.55), 0 0 100px 50px rgba(255,160,0,0.22);
      animation: sunPulse 3s ease-in-out infinite alternate; z-index:1;
    }
    @keyframes sunPulse {
      from { box-shadow:0 0 50px 20px rgba(255,210,30,0.55),0 0 100px 50px rgba(255,160,0,0.22); }
      to   { box-shadow:0 0 70px 30px rgba(255,220,50,0.75),0 0 130px 70px rgba(255,170,0,0.32); }
    }
    /* 태양 광선 */
    .sun-rays {
      position: fixed; top: 7vh; left: 12vw;
      width: 80px; height: 80px; z-index: 0;
      animation: raysRotate 12s linear infinite;
    }
    @keyframes raysRotate { to { transform: rotate(360deg); } }

    /* 구름 */
    .cloud {
      position: fixed; z-index: 1;
      background: #fff;
      border-radius: 50px;
      animation: cloudDrift var(--cd,18s) ease-in-out infinite alternate;
      opacity: 0.88;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }
    .cloud::before, .cloud::after {
      content:''; position:absolute;
      background: #fff; border-radius:50%;
    }
    @keyframes cloudDrift {
      from { transform: translateX(0); }
      to   { transform: translateX(30px); }
    }

    /* 모래 언덕 배경 */
    .dunes {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: 28vh; z-index: 1; pointer-events: none;
    }
    .dunes svg { width:100%; height:100%; }

    /* 땅 */
    .ground {
      position:fixed; bottom:0; left:0; right:0; height:55px;
      background:linear-gradient(to bottom,#c8864a,#a0622a); z-index:2;
    }
    .ground::before {
      content:''; display:block; height:8px;
      background:repeating-linear-gradient(90deg,#b07030 0px,#d09050 20px,#b07030 40px);
    }

    /* 부족 테두리 */
    .tribal-border { position:fixed; inset:0; pointer-events:none; z-index:3; }
    .tribal-border svg { width:100%; height:100%; }

    /* 비 레이어 */
    .rain-layer { position:fixed; inset:0; pointer-events:none; z-index:5; overflow:hidden; }
    .raindrop {
      position:absolute; top:-60px; opacity:0;
      animation:rainFall var(--dur,2.2s) linear var(--delay,0s) infinite;
    }
    @keyframes rainFall {
      0%   { opacity:0; transform:translateY(0) rotate(0deg); }
      10%  { opacity:0.85; }
      80%  { opacity:0.7; }
      100% { opacity:0; transform:translateY(105vh) rotate(360deg); }
    }

    /* 깃털 */
    .feather {
      position:fixed; opacity:0; pointer-events:none; z-index:6;
      animation:featherFloat var(--fd,4s) ease-in-out var(--fdelay,0s) infinite;
    }
    @keyframes featherFloat {
      0%   { opacity:0; transform:translateY(0) rotate(0deg) translateX(0); }
      20%  { opacity:0.9; }
      80%  { opacity:0.7; }
      100% { opacity:0; transform:translateY(-60vh) rotate(180deg) translateX(30px); }
    }

    /* 토템 */
    .totem { position:fixed; bottom:55px; z-index:2; }
    .totem-face {
      width:36px; text-align:center; font-size:20px;
      background:linear-gradient(180deg,#8B4513,#A0522D);
      border-radius:4px; padding:2px 0; line-height:1.3;
    }
    .totem-base {
      width:30px; height:65px;
      background:linear-gradient(180deg,#8B4513,#6B3410);
      border-radius:4px 4px 2px 2px; margin:0 auto;
    }

    /* 모닥불 (낮엔 연기만, 불꽃 살짝 약하게) */
    .campfire-wrap { position:fixed; bottom:60px; z-index:8; }
    .flame {
      width:0; height:0;
      border-left:14px solid transparent; border-right:14px solid transparent;
      border-bottom:35px solid #ff6a00;
      position:absolute; bottom:10px;
      filter:blur(2px); transform-origin:bottom center;
    }
    .f1 { animation:fl1 0.6s ease-in-out infinite alternate; }
    .f2 { border-bottom-color:#ffb300; border-left-width:9px; border-right-width:9px; border-bottom-width:26px; left:7px; animation:fl2 0.5s ease-in-out infinite alternate; }
    .f3 { border-bottom-color:#fff176; border-left-width:5px; border-right-width:5px; border-bottom-width:17px; left:13px; animation:fl3 0.4s ease-in-out infinite alternate; }
    @keyframes fl1 { from{transform:scaleX(1) rotate(-3deg);} to{transform:scaleX(0.85) rotate(4deg);} }
    @keyframes fl2 { from{transform:scaleX(1) rotate(2deg);}  to{transform:scaleX(1.1)  rotate(-3deg);} }
    @keyframes fl3 { from{transform:scaleX(1) rotate(-1deg);} to{transform:scaleX(0.9)  rotate(2deg);} }
    .logs { width:60px; height:16px; background:linear-gradient(90deg,#4e2605,#7a3a0a,#4e2605); border-radius:6px; position:relative; z-index:3; }

    /* 연기 */
    .smoke-puff {
      position:absolute; border-radius:50%;
      background:rgba(180,120,60,0.3);
      animation:smokePuff var(--sd,3s) ease-out var(--sdelay,0s) infinite;
    }
    @keyframes smokePuff {
      0%   { width:5px;height:5px;opacity:0.6;transform:translateY(0) translateX(0) scale(1); }
      100% { width:35px;height:35px;opacity:0;transform:translateY(-160px) translateX(var(--sx,8px)) scale(3); }
    }

    /* ━━━ 메인 컨테이너 ━━━ */
    .container {
      position:relative; z-index:10;
      display:flex; flex-direction:column; align-items:center;
      padding-bottom:80px;
    }

    /* 제목 */
    .title-main {
      font-size:clamp(2rem,6vw,3.2rem); font-weight:900;
      color:#7a3000;
      text-shadow: 2px 2px 0 #ffcc55, 0 0 20px rgba(255,160,30,0.5), 0 3px 8px rgba(0,0,0,0.25);
      letter-spacing:0.08em; text-align:center;
    }
    .title-sub {
      font-size:clamp(0.75rem,2vw,0.95rem); color:#8b4500;
      letter-spacing:0.22em; margin-top:4px; text-align:center;
      text-transform:uppercase; opacity:0.85; margin-bottom:4px;
    }

    /* ━━━ 씬 (제단 + 캐릭터) ━━━ */
    .scene {
      position:relative;
      width:min(860px,95vw);
      height:310px;
      margin:0 auto;
      overflow:visible;
    }

    /* 캐릭터 — 씬 정중앙 */
    .character {
      position:absolute;
      bottom:28px; left:50%;
      transform:translateX(-50%);
      width:min(200px,30vw); height:auto;
      z-index:20;
      animation:dance 0.65s ease-in-out infinite alternate;
      transform-origin:bottom center;
      filter:drop-shadow(0 10px 24px rgba(200,100,30,0.5)) drop-shadow(0 0 35px rgba(245,200,66,0.2));
    }
    @keyframes dance {
      0%   { transform:translateX(-50%) rotate(-5deg) scaleY(1)    translateY(0px); }
      25%  { transform:translateX(-50%) rotate(0deg)  scaleY(1.04) translateY(-9px); }
      50%  { transform:translateX(-50%) rotate(5deg)  scaleY(1)    translateY(0px); }
      75%  { transform:translateX(-50%) rotate(0deg)  scaleY(1.04) translateY(-9px); }
      100% { transform:translateX(-50%) rotate(-5deg) scaleY(1)    translateY(0px); }
    }

    /* ━━━ 제단 — 씬 오른쪽 배치 ━━━ */
    .altar-wrap {
      position:absolute;
      bottom:8px; right:0;
      z-index:15;
    }

    /* 제단 애니메이션 */
    .altar-flame { animation:altarFlicker var(--af,0.7s) ease-in-out infinite alternate; }
    @keyframes altarFlicker {
      from { transform:scaleY(1) scaleX(1) translateY(0); opacity:0.9; }
      to   { transform:scaleY(1.2) scaleX(0.85) translateY(-4px); opacity:1; }
    }
    .altar-glow { animation:altarGlow 2s ease-in-out infinite alternate; }
    @keyframes altarGlow {
      from { opacity:0.4; }
      to   { opacity:0.9; }
    }
    .chart-line {
      stroke-dasharray:200; stroke-dashoffset:200;
      animation:drawChart 2.5s ease-in-out 0.5s infinite;
    }
    @keyframes drawChart {
      0%  { stroke-dashoffset:200; opacity:1; }
      60% { stroke-dashoffset:0;   opacity:1; }
      85% { stroke-dashoffset:0;   opacity:1; }
      100%{ stroke-dashoffset:0;   opacity:0; }
    }

    /* ━━━ 정보 패널 (주문 + 로딩바 묶음) ━━━ */
    .info-panel {
      background: rgba(255, 238, 195, 0.84);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1.5px solid rgba(160, 85, 10, 0.38);
      border-radius: 20px;
      padding: 14px 30px 18px;
      width: min(380px, 88vw);
      box-shadow: 0 6px 28px rgba(100,50,0,0.22), inset 0 1px 0 rgba(255,255,255,0.55);
      margin-top: 4px;
    }

    /* 주문 */
    .chant {
      font-size:clamp(0.95rem,2.8vw,1.25rem); color:#5a2000;
      text-align:center; letter-spacing:0.05em; font-weight:700;
      animation:chantPulse 1.1s ease-in-out infinite alternate;
      text-shadow: 0 1px 0 rgba(255,220,140,0.6);
      min-height:1.8em;
      transition:opacity 0.3s ease;
    }
    @keyframes chantPulse {
      from { opacity:0.65; }
      to   { opacity:1; }
    }

    /* 로딩바 */
    .loading-wrap { width:100%; margin-top:12px; }
    .loading-label {
      display:flex; justify-content:space-between;
      font-size:0.72rem; color:rgba(80,30,0,0.75); font-weight:600;
      letter-spacing:0.12em; margin-bottom:7px; text-transform:uppercase;
    }
    .bar-bg {
      height:11px; background:rgba(120,60,0,0.12);
      border-radius:8px; overflow:hidden;
      border:1.5px solid rgba(160,80,10,0.3);
    }
    .bar-fill {
      height:100%; width:0%;
      background:linear-gradient(90deg,#c84000,#ff6a00,#ffb300,#f5c842);
      border-radius:8px;
      animation:loadProgress 4s cubic-bezier(0.4,0,0.2,1) infinite;
      box-shadow:0 0 10px 2px rgba(255,150,30,0.5);
    }
    @keyframes loadProgress {
      0%  { width:0%;   }
      70% { width:88%;  }
      90% { width:95%;  }
      100%{ width:100%; }
    }
  </style>
</head>

  <div class="title-sub">Stock Market Rain Dance</div>

  <!-- 씬 -->
  <div class="scene">

    <!-- 제단 -->

        <ellipse cx="250" cy="210" rx="220" ry="38" fill="url(#gc)"/>

  ['🪶','🌿','✨','🪶','🌿'].forEach((e,i) => {
    const f = document.createElement('div');
    f.className = 'feather';
    f.textContent = e;
    f.style.cssText = `left:${15+i*17}%;bottom:${5+Math.floor(Math.random()*15)}%;font-size:22px;--fd:${(Math.random()*3+3.5).toFixed(1)}s;--fdelay:${(i*0.9).toFixed(1)}s;`;
    fw.appendChild(f);
  });

  /* 연기 */
  ['sm-l','sm-r'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    for (let i = 0; i < 5; i++) {
      const p = document.createElement('div');
      p.className = 'smoke-puff';
      p.style.cssText = `--sd:${(Math.random()*2+2.5).toFixed(1)}s;--sdelay:${(Math.random()*3).toFixed(1)}s;--sx:${(Math.random()*30-15).toFixed(0)}px;`;
      el.appendChild(p);
    }
  });

  /* 로딩 % */
  const pctEl = document.getElementById('pct');
  const barEl = document.getElementById('bar');
  setInterval(() => {
    const w = parseFloat(getComputedStyle(barEl).width);
    const t = barEl.parentElement.offsetWidth;
    if (t) pctEl.textContent = Math.min(Math.round(w/t*100),100)+'%';
  }, 80);

  /* 주문 순환 */
  const chants = [
    '📈 주식아 올라라... 📈',
    '🙏 신성한 차트여... 🙏',
    '🌧️ 수익비를 내려라... 🌧️',
    '🪶 코스피야 들어라... 🪶',
    '🔥 장대양봉 내려주소서... 🔥',
    '💰 손실아 물러가라... 💰',
    '🚀 달나라까지 가자... 🚀',
    '🎰 -20%는 이제 그만... 🎰',
    '✨ 익절의 기쁨이여... ✨',
    '📊 상한가를 허락하소서... 📊',
  ];
  let ci = 0;
  const chantEl = document.getElementById('chant');
  setInterval(() => {
    chantEl.style.opacity='0';
    setTimeout(()=>{ ci=(ci+1)%chants.length; chantEl.textContent=chants[ci]; chantEl.style.opacity='1'; },300);
  }, 2000);
</script>
</body>
</html>
