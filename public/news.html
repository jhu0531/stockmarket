<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>경제뉴스 | 주린이 기우제</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/icons/favicon-32.png" sizes="32x32" />
  <link rel="icon" type="image/png" href="/icons/favicon-16.png" sizes="16x16" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#14161a" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="loading-overlay">
    <iframe id="loading-frame" title="로딩 중"></iframe>
  </div>
  <script>
    if (sessionStorage.getItem('raindanceShown')) {
      document.getElementById('loading-overlay').remove();
    } else {
      sessionStorage.setItem('raindanceShown', '1');
      document.getElementById('loading-frame').src = 'loading.html';
    }
  </script>

  <div class="app-shell">
    <nav class="sidebar">
      <div class="sidebar-brand">🪶 주린이 기우제</div>
      <a href="/" class="sidebar-link"><span class="sidebar-icon">🏠</span><span>홈</span></a>
      <a href="/news.html" class="sidebar-link active"><span class="sidebar-icon">📰</span><span>경제뉴스</span></a>
      <a href="/calendar.html" class="sidebar-link"><span class="sidebar-icon">📅</span><span>증시캘린더</span></a>
      <a href="/reports.html" class="sidebar-link"><span class="sidebar-icon">📄</span><span>증시리포트</span></a>
      <a href="/compass.html" class="sidebar-link"><span class="sidebar-icon">🧭</span><span>증시나침반</span></a>
    </nav>

    <div class="app-content">
      <header class="site-header">
        <div class="container">
          <h1>경제뉴스</h1>
          <p class="subtitle">해외뉴스 · 국내뉴스</p>
        </div>
      </header>

      <main class="container">
        <section class="news-section" id="ny-news-section">
          <div class="section-header">
            <h2 class="section-title">해외뉴스</h2>
            <button id="news-section-toggle" class="section-toggle" type="button" aria-expanded="true" aria-controls="ny-news-list">
              접기
            </button>
          </div>
          <ul class="news-list" id="ny-news-list">
            <li class="news-item news-loading">불러오는 중...</li>
          </ul>
        </section>

        <section class="news-section" id="kr-news-section">
          <div class="section-header">
            <h2 class="section-title">국내뉴스</h2>
            <button id="kr-news-section-toggle" class="section-toggle" type="button" aria-expanded="true" aria-controls="kr-news-body">
              접기
            </button>
          </div>
          <div id="kr-news-body">
            <h3 class="news-subheading">거시경제</h3>
            <ul class="news-list" id="kr-news-macro-list">
              <li class="news-item news-loading">불러오는 중...</li>
            </ul>
            <h3 class="news-subheading">미시경제</h3>
            <ul class="news-list" id="kr-news-micro-list">
              <li class="news-item news-loading">불러오는 중...</li>
            </ul>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <div class="container">
          <p>데이터 제공: 네이버 금융 · 자동 갱신 2분</p>
        </div>
      </footer>
    </div>
  </div>

  <script src="news.js"></script>
</body>
</html>
