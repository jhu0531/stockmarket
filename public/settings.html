<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>설정 | 주린이 기우제</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />

  <link rel="icon" type="image/png" href="/icons/favicon-16.png" sizes="16x16" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#14161a" />
  <link rel="stylesheet" href="style.css" />
  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      if (saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-theme', saved);
    })();
  </script>
</head>
<body>
  <div id="loading-overlay">
    <iframe id="loading-frame" title="로딩 중"></iframe>
  </div>
  <script>
    if (sessionStorage.getItem('raindanceShown')) {
      document.getElementById('loading-overlay').remove();
    } else {
      sessionStorage.setItem('raindanceShown', '1');
      document.getElementById('loading-frame').src = 'loading.html';
    }
  </script>

  <div class="app-shell">
    <nav class="sidebar">
      <div class="sidebar-brand">🪶 주린이 기우제</div>
      <button type="button" id="mobile-menu-btn" class="sidebar-link mobile-menu-btn"><span class="sidebar-icon">☰</span><span>메뉴</span></button>
      <a href="/" class="sidebar-link"><span class="sidebar-icon">🏠</span><span>홈</span></a>
      <a href="/news.html" class="sidebar-link"><span class="sidebar-icon">📰</span><span>경제뉴스</span></a>
      <a href="/calendar.html" class="sidebar-link"><span class="sidebar-icon">📅</span><span>캘린더</span></a>
      <a href="/reports.html" class="sidebar-link"><span class="sidebar-icon">📄</span><span>리포트</span></a>
      <a href="/compass.html" class="sidebar-link"><span class="sidebar-icon">🧭</span><span>나침반</span></a>
      <a href="/watchlist.html" class="sidebar-link desktop-only-link"><span class="sidebar-icon">⭐</span><span>관심종목</span></a>
      <a href="/valuation.html" class="sidebar-link desktop-only-link"><span class="sidebar-icon">🧮</span><span>적정주가</span></a>
      <a href="/settings.html" class="sidebar-link desktop-only-link active"><span class="sidebar-icon">⚙️</span><span>설정</span></a>
      <div class="mobile-menu-drawer" id="mobile-menu-drawer" hidden>
        <a href="/watchlist.html" class="mobile-menu-drawer-link"><span class="sidebar-icon">⭐</span><span>관심종목</span></a>
        <a href="/valuation.html" class="mobile-menu-drawer-link"><span class="sidebar-icon">🧮</span><span>적정주가</span></a>
        <a href="/settings.html" class="mobile-menu-drawer-link"><span class="sidebar-icon">⚙️</span><span>설정</span></a>
      </div>
    </nav>

    <div class="app-content">
      <header class="site-header">
        <div class="container">
          <h1>설정</h1>
          <p class="subtitle">화면 표시 옵션</p>
        </div>
      </header>

      <main class="container">
        <div class="settings-row">
          <div>
            <p class="settings-row-title">다크모드</p>
            <p class="settings-row-desc">화면을 어둡게 표시합니다. 기기 설정을 따르지 않고 이 선택이 우선 적용됩니다.</p>
          </div>
          <label class="theme-switch-wrap">
            <input type="checkbox" id="theme-switch" />
            <span class="theme-switch-slider"></span>
          </label>
        </div>
      </main>

      <footer class="site-footer">
        <div class="container">
          <p>주린이 기우제</p>
        </div>
      </footer>
