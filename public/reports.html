<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>증시리포트 | 주린이 기우제</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/icons/favicon-32.png" sizes="32x32" />
  <link rel="icon" type="image/png" href="/icons/favicon-16.png" sizes="16x16" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#14161a" />
  <link rel="stylesheet" href="style.css" />
  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      var theme = saved === 'light' || saved === 'dark' ? saved : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      if (saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-theme', saved);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'dark' ? '#14161a' : '#f5f6f8');
    })();
  </script>
</head>
<body>
  <div id="loading-overlay">
    <iframe id="loading-frame" title="로딩 중"></iframe>
  </div>
  <script>
    if (sessionStorage.getItem('raindanceShown')) {
      document.getElementById('loading-overlay').remove();
    } else {
      sessionStorage.setItem('raindanceShown', '1');
      document.getElementById('loading-frame').src = 'loading.html';
    }
  </script>

  <div class="app-shell">
    <nav class="sidebar">
      <div class="sidebar-brand">🪶 주린이 기우제</div>

      <a href="/" class="sidebar-link"><span class="sidebar-icon">🏠</span><span>홈</span></a>
      <a href="/news.html" class="sidebar-link"><span class="sidebar-icon">📰</span><span>경제뉴스</span></a>
      <a href="/calendar.html" class="sidebar-link"><span class="sidebar-icon">📅</span><span>캘린더</span></a>
      <a href="/reports.html" class="sidebar-link active"><span class="sidebar-icon">📄</span><span>리포트</span></a>
      <a href="/compass.html" class="sidebar-link"><span class="sidebar-icon">🧭</span><span>나침반</span></a>
      <a href="/screener.html" class="sidebar-link desktop-only-link"><span class="sidebar-icon">📊</span><span>실적주</span></a>
      <a href="/watchlist.html" class="sidebar-link desktop-only-link"><span class="sidebar-icon">⭐</span><span>관심종목</span></a>
      <a href="/valuation.html" class="sidebar-link desktop-only-link"><span class="sidebar-icon">🧮</span><span>적정주가</span></a>
      <a href="/settings.html" class="sidebar-link desktop-only-link"><span class="sidebar-icon">⚙️</span><span>설정</span></a>
      <div class="mobile-menu-drawer" id="mobile-menu-drawer" hidden>
        <a href="/screener.html" class="mobile-menu-drawer-link"><span class="sidebar-icon">📊</span><span>실적주</span></a>
        <a href="/watchlist.html" class="mobile-menu-drawer-link"><span class="sidebar-icon">⭐</span><span>관심종목</span></a>
        <a href="/valuation.html" class="mobile-menu-drawer-link"><span class="sidebar-icon">🧮</span><span>적정주가</span></a>
        <a href="/settings.html" class="mobile-menu-drawer-link"><span class="sidebar-icon">⚙️</span><span>설정</span></a>
      </div>
    </nav>

    <div class="app-content">
      <header class="site-header">
        <div class="container">
          <h1>증시리포트</h1>
          <p class="subtitle">증권사 산업별동향 · 종목별리포트</p>
        </div>
      </header>

      <main class="container">
        <select id="report-category-select" class="report-category-select">
          <option value="industry">산업별동향</option>
          <option value="company">종목별리포트</option>
        </select>

        <section id="industry-report-section">
          <ul class="report-list" id="industry-report-list">
            <li class="calendar-empty">불러오는 중...</li>
          </ul>

        <section id="company-report-section" hidden>
          <ul class="report-list" id="company-report-list">
            <li class="calendar-empty">불러오는 중...</li>
          </ul>
        </section>
      </main>

      <footer class="site-footer">

          <p>데이터 제공: 네이버 금융 리서치</p>
        </div>

    </div>
  </div>

  <script src="reports.js"></script>
  <script src="sidebar-menu.js"></script>

</html>
